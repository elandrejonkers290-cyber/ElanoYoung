name: Build Metal Amp (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload plugin and standalone app
        uses: actions/upload-artifact@v4
        with:
          name: MetalAmp-Windows
          path: build/MetalAmp_artefacts/Release/
